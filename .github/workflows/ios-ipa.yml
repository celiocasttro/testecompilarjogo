name: Operacao Fenix iOS IPA
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          GODOT="$PWD/godot-bin/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT" || chmod +x "$GODOT"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable/"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path fps-game --quit

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fps-game/build/ios
          "$GODOT" --headless --path fps-game --export-release "iOS" "$PWD/fps-game/build/ios/OperacaoFenix"
          find fps-game/build/ios -maxdepth 4 -print
          PROJECT="$(find "$PWD/fps-game/build/ios" -maxdepth 4 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"

      - name: Build and package unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find "$PWD/fps-game/build/ios" -maxdepth 4 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          xcodebuild -project "$PROJECT" -scheme OperacaoFenix -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$PWD/ios-derived" CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$PWD/ios-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$PWD/ipa-stage/Payload"
          cp -R "$APP" "$PWD/ipa-stage/Payload/"
          cd "$PWD/ipa-stage"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/fps-game/build/ios/OperacaoFenix-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          test -s fps-game/build/ios/OperacaoFenix-unsigned.ipa
          /usr/bin/unzip -t fps-game/build/ios/OperacaoFenix-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: operacao-fenix-ios-unsigned-ipa
          path: fps-game/build/ios/OperacaoFenix-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
