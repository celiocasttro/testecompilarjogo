name: Operacao Fenix iOS IPA
'on':
  push:
    branches:
      - main
    paths:
      - 'fps-game/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          GODOT="$PWD/godot-bin/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable/"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: "$GODOT" --headless --editor --path fps-game --quit

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fps-game/build/ios
          "$GODOT" --headless --path fps-game --export-release "iOS" build/ios/OperacaoFenix
          test -d fps-game/build/ios/OperacaoFenix

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find fps-game/build/ios/OperacaoFenix -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "Godot did not create an Xcode project."
            find fps-game/build/ios -maxdepth 4 -print
            exit 1
          fi
          xcodebuild -project "$PROJECT" -configuration Release -sdk iphoneos -derivedDataPath "$PWD/ios-derived" CODE_SIGNING_ALLOWED=NO build
          APP="$(find ios-derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p ipa-stage/Payload
          cp -R "$APP" ipa-stage/Payload/
          cd ipa-stage
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/fps-game/build/ios/OperacaoFenix-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          test -s fps-game/build/ios/OperacaoFenix-unsigned.ipa
          /usr/bin/unzip -t fps-game/build/ios/OperacaoFenix-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: operacao-fenix-ios-unsigned-ipa
          path: fps-game/build/ios/OperacaoFenix-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
