name: Build iOS IPA
on:
  push:
    branches: [ main ]
    paths:
      - 'iOS/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec iOS/project.yml --project iOS
      - name: Build for iPhone device (unsigned)
        run: xcodebuild -project iOS/DesvieDosBlocos.xcodeproj -scheme DesvieDosBlocos -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Desvie dos Blocos.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r "$GITHUB_WORKSPACE/DesvieDosBlocos-unsigned.ipa" Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: desvie-dos-blocos-ipa-unsigned
          path: DesvieDosBlocos-unsigned.ipa
          retention-days: 14
