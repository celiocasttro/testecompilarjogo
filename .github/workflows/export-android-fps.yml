name: Export Operacao Fenix Android APK
on:
  push:
    branches: [ main ]
    paths:
      - 'fps-game/**'
      - '.github/workflows/export-android-fps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Import project
        run: godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path fps-game --quit
      - name: Export debug APK
        run: |
          mkdir -p build
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path fps-game --export-debug "Android" build/operacao-fenix-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: operacao-fenix-android-debug-apk
          path: build/operacao-fenix-debug.apk
          if-no-files-found: error
          retention-days: 14
